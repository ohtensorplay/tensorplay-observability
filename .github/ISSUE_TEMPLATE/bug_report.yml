name: 🐞 Bug report
description: Report reproducible incorrect behavior in tensorplay-observability
title: "[Bug] "
labels: ["bug"]
body:
  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues and did not find this problem.
          required: true
        - label: I am using the latest release or the current `main` branch.
          required: true
        - label: I can provide a minimal reproduction and environment details below.
          required: true
  - type: textarea
    id: description
    attributes:
      label: Describe the bug
      description: A clear and concise description of what went wrong and what you expected.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: |
        Include the smallest script or command that reproduces the problem, the
        exact snapshot (or log record) involved, and the full traceback if
        applicable. Redact secrets and tokens.
      placeholder: |
        from tp_observability import render_prometheus_metrics
        print(render_prometheus_metrics({"http_requests": [...]}, prefix="tp"))
        # expected: ...
        # actual:   ...
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: |
        Please provide: OS, Python version, package version/commit, Rust
        toolchain version (for the renderer crate), and which optional extras
        are installed (`otel`, `tracking`).
      placeholder: |
        tensorplay-observability: 0.1.0 (commit ...)
        Python: 3.12.x, Rust: 1.7x
        extras: [otel, tracking]
    validations:
      required: true
  - type: textarea
    id: workaround
    attributes:
      label: Workaround / additional context
      description: Anything else that may help, including a workaround you found.